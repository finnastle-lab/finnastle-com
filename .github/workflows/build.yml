name: Build site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify sunmarks in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/fa-review" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/fa-review/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/fa-preview.log" 2>&1 &
          node --input-type=commonjs <<'JS'
          const { chromium } = require(process.env.RUNNER_TEMP + '/fa-review/node_modules/playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            for (let i = 0; i < 30; i++) {
              try { await page.goto('http://127.0.0.1:4321/'); break; }
              catch (error) { if (i === 29) throw error; await new Promise(r => setTimeout(r, 500)); }
            }
            for (const width of [390, 1440]) {
              await page.setViewportSize({ width, height: 1000 });
              for (const theme of ['light', 'dark']) {
                await page.evaluate(theme => document.documentElement.setAttribute('data-theme', theme), theme);
                // Chrome marks: one black-ink source, recoloured by filter.
                for (const [selector, expectedWidth] of [['.brand .mark', 26], ['footer .mark', 18]]) {
                  const mark = page.locator(selector);
                  await mark.evaluate(image => image.decode());
                  const state = await mark.evaluate(image => ({
                    width: parseFloat(getComputedStyle(image).width),
                    filter: getComputedStyle(image).filter,
                    loaded: image.complete && image.naturalWidth > 0,
                    source: image.currentSrc,
                  }));
                  assert.equal(state.width, expectedWidth);
                  assert.equal(state.loaded, true);
                  assert.equal(state.filter, `brightness(0) invert(${theme === 'dark' ? 1 : 0})`);
                  console.log(JSON.stringify({ width, theme, selector, ...state }));
                }
                // Sky panel: the canonical pair, picked by contrast with the
                // ground rather than recoloured. The black mark serves the day
                // sky, the white one the night, and neither carries a filter.
                const shown = theme === 'dark' ? '.sky-mark--dark-ground' : '.sky-mark--light-ground';
                const hidden = theme === 'dark' ? '.sky-mark--light-ground' : '.sky-mark--dark-ground';
                const sky = await page.locator(shown).evaluate(image => ({
                  display: getComputedStyle(image).display,
                  filter: getComputedStyle(image).filter,
                  width: parseFloat(getComputedStyle(image).width),
                  loaded: image.complete && image.naturalWidth > 0,
                  source: image.currentSrc,
                }));
                assert.equal(sky.display, 'block');
                assert.equal(sky.filter, 'none', 'the canonical mark is never colour-filtered');
                assert.equal(sky.loaded, true);
                assert.match(sky.source, new RegExp(`/fa-sunmark-${theme === 'dark' ? 'light' : 'dark'}\\.[^/]+\\.svg$`));
                assert(sky.width > 100 && sky.width < 200, `sky mark width ${sky.width}`);
                assert.equal(await page.locator(hidden).evaluate(i => getComputedStyle(i).display), 'none');
                console.log(JSON.stringify({ width, theme, selector: shown, ...sky }));
                // The day sky is pixel art: an ordered-dithered plate on the
                // 440px grid the Figma study was drawn on, scaled up with
                // nearest-neighbour and never recoloured at runtime. A build
                // that re-encodes it, smooths it, or filters it has thrown
                // away the thing it exists for.
                if (theme === 'light') {
                  await page.locator('.sky').scrollIntoViewIfNeeded();
                  const plate = page.locator('.sky-plate--base img');
                  await plate.evaluate(image => image.decode());
                  const sky = await plate.evaluate(image => ({
                    rendering: getComputedStyle(image).imageRendering,
                    filter: getComputedStyle(image.parentElement).filter,
                    natural: image.naturalWidth + 'x' + image.naturalHeight,
                    source: image.currentSrc,
                  }));
                  assert.equal(sky.rendering, 'pixelated');
                  assert.equal(sky.filter, 'none', 'the dithered plate is never recoloured at runtime');
                  assert.equal(sky.natural, width < 768 ? '220x220' : '440x293');
                  assert.match(sky.source, /\/sky-base-(wide|narrow)\.[^/]+\.png$/);
                  console.log(JSON.stringify({ width, theme, ...sky }));
                  await page.evaluate(() => scrollTo(0, 0));
                }
                // The homepage carries full-bleed imagery; it must still not
                // scroll sideways at either width.
                assert.equal(
                  await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth),
                  true,
                  `horizontal overflow at ${width}/${theme}`,
                );
                await page.screenshot({ path: `sunmark-${width}-${theme}.png`, fullPage: true });
              }
            }
            assert.deepEqual(errors, []);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: sunmark-theme-previews
          path: sunmark-*.png
      - name: Canonical sunmark SVGs ship byte-identical
        run: |
          # The rule in src/assets/brand/fa-sunmark/README.md: copy the file,
          # never redraw, retrace or recolour it. A build that rewrites the
          # bytes has broken that, whatever the page looks like.
          for ink in dark light; do
            want=$(shasum -a 256 "src/assets/brand/fa-sunmark/fa-sunmark-$ink.svg" | cut -d' ' -f1)
            built=$(ls dist/_astro/fa-sunmark-$ink.*.svg)
            got=$(shasum -a 256 "$built" | cut -d' ' -f1)
            echo "fa-sunmark-$ink.svg  src=$want  built=$got  ($built)"
            [ "$want" = "$got" ] || { echo "::error::$built does not match the canonical source"; exit 1; }
          done
      - name: Dithered sky plates ship byte-identical, and rebuild the same
        run: |
          # Astro copies these straight through rather than re-encoding them.
          # A palette PNG pushed through a lossy converter loses its dither,
          # which is the whole design, so the bytes have to match.
          for plate in sky-base-wide sky-base-narrow sky-near-wide sky-near-narrow; do
            want=$(shasum -a 256 "src/assets/home/sky/$plate.png" | cut -d' ' -f1)
            built=$(ls dist/_astro/$plate.*.png)
            got=$(shasum -a 256 "$built" | cut -d' ' -f1)
            echo "$plate.png  src=$want  built=$got  ($built)"
            [ "$want" = "$got" ] || { echo "::error::$built does not match the committed plate"; exit 1; }
          done
          # And the generator is deterministic: the committed plates are what
          # the script produces, so provenance in sources.json is checkable.
          node scripts/build-sky-dither.mjs
          git diff --exit-code -- src/assets/home/sky \
            || { echo "::error::scripts/build-sky-dither.mjs does not reproduce the committed plates"; exit 1; }

      - name: Verify cutout catalogue and browser behaviour
        run: |
          node scripts/check-icon-catalogue.mjs
          node scripts/check-cutout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutout-library-previews
          path: cutout-*.png
